name: CI

on:
  push:
    branches:
      - erick
      - main
  pull_request:
    branches:
      - erick
      - main

jobs:
  test:
    name: Demo App Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install demo-app dependencies
        run: pip install -r demo_app/requirements.txt

      - name: Run demo-app test suite
        run: PYTHONPATH=demo_app pytest demo_app/tests -v
