[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ripple-mcp"
version = "0.1.0"
description = "A project-aware MCP operational gateway for coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=2.2.0,<3",
  "python-dotenv>=1.0",
]

[project.urls]
Repository = "https://github.com/Mechantchulo/Ripple-MCP"

[project.scripts]
ripple = "ripple.cli:main"

[tool.setuptools.packages.find]
include = ["ripple*", "server*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".venv", "node_modules", "frontend", "build", "dist", "demo_app"]

